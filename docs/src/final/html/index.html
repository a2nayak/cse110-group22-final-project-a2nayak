<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Typing Game</title>
  <link rel="preload" href="/cse110-group22-final-project-a2nayak/assets/Livvic-Regular-DB8QqusR.woff2" type="font/woff2" as="font" crossorigin />
  
  <script type="module" crossorigin src="/cse110-group22-final-project-a2nayak/assets/index-Bbyp-fEw.js"></script>
  <link rel="stylesheet" crossorigin href="/cse110-group22-final-project-a2nayak/assets/index-DATbL7sC.css">
</head>

<body>

  <!-- RulesBox -->
    <div class="rules-box">
      <h3>How to play!</h3>
      <p>Read the question and submit your answer in the box below.</p>
    </div>

  <!-- MainMenu -->
  <div id="main-menu">
    <h1>Hello, Farm!</h1>
    <ul class="main-menu-list">
      <li><button type="button" class="main-menu-btn" data-language="python">Python</button></li>
      <li><button type="button" class="main-menu-btn" data-language="javascript">JavaScript</button></li>
    </ul>
  </div>

  <!-- ResultsScreen: hidden until game engine calls showResults() -->
  <div class="results-screen">
    <h2 class="results-title">Round Complete!</h2>
    <p class="results-label">Language: <span class="results-language">Python</span></p>
    <div class="results-stats">
      <div class="results-stat">
        <span class="results-label">Score</span>
        <span class="results-stat-value results-score">0</span>
      </div>
      <div class="results-stat">
        <span class="results-label">Accuracy</span>
        <span class="results-stat-value results-accuracy">0%</span>
      </div>
      <div class="results-stat">
        <span class="results-label">CPM</span>
        <span class="results-stat-value results-cpm">0</span>
      </div>
      <div class="results-stat">
        <span class="results-label">Questions</span>
        <span class="results-stat-value results-questions">0 / 0</span>
      </div>
    </div>
    <div class="results-actions">
      <button type="button" class="results-main-menu">
        <svg viewBox="0 0 24 24" width="18" height="18"><use href="/cse110-group22-final-project-a2nayak/assets/menu-icon-CPBL6PLd.svg#menu-icon"></use></svg>
        Main Menu
      </button>
      <button type="button" class="results-retry">
        <svg viewBox="0 0 24 24" width="18" height="18"><use href="/cse110-group22-final-project-a2nayak/assets/retry-icon-J6IKU1JF.svg#retry-icon"></use></svg>
        Retry
      </button>
      <button type="button" class="results-next">
        <svg viewBox="0 0 24 24" width="18" height="18"><use href="/cse110-group22-final-project-a2nayak/assets/next-icon-BNHopGw9.svg#next-icon"></use></svg>
        Next
      </button>
    </div>
  </div>

  <!-- GameUI -->
  <div id="game-ui" class="game-ui">
    <button type="button" class="game-header-pause">
      <svg viewBox="0 0 256 256"><use href="/cse110-group22-final-project-a2nayak/assets/pause-icon-BKsTdXC-.svg#pause-icon" fill="#E53935"></use></svg>
    </button>

    <div class="timer-container">
      <!-- Timer -->
      <span class="timer">0:00</span>
    </div>

    <!--NotificationDisplay-->
    <div class="notification-display">
      <span class="notification-display-text"></span>
    </div>

    <!-- Combo -->
    <div class="combo"><span class="combo-number">0</span></div>

    <!-- PauseMenu -->
    <div class="pause-menu">
        <h3 class="pause-menu-title">Paused</h3>
        <ul class="pause-menu-list">
            <li><button type="button" class="pause-menu-resume">Resume</button></li>
            <li><button type="button" class="pause-menu-retry">Retry</button></li>
            <li><button type="button" class="pause-menu-main-menu">Main Menu</button></li>
        </ul>
        <h4 class="pause-menu-current-language"></h4>
    </div>

    
    <!-- PlantDisplayGroup -->
    <div class="plant-display-group"></div>
    <div class="game-input-area">
      <!-- PromptDisplay -->
      <div class="prompt-display">
        <p class="prompt-display-text">Loading question...</p>
      </div>
      <!-- CodeInputField -->
      <div class="code-input-field">
        <div class="ghost-text">
          <span class="ghost-text-invisible"></span>
          <span class="ghost-text-visible"></span>
        </div>
        <input class="code-input" />
      </div>
    </div>

    <div class="game-tray">
      <!-- StatsDisplay -->
      <div class="stats-display">
        <span class="stats-display-score">00000</span>
        <span class="stats-display-accuracy" style="display: none;">100%</span>
        <span class="stats-display-cpm">0 cpm</span>
      </div> 
    </div>
  </div>
</body>
</html>
